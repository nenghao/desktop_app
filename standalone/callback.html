<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple 登录 - 正在处理...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .apple-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .apple-logo svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .message {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .loader {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
        }

        .error.show {
            display: block;
        }

        .error-icon {
            font-size: 48px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .error h1 {
            color: #e74c3c;
        }

        .success {
            display: none;
        }

        .success.show {
            display: block;
        }

        .success-icon {
            font-size: 48px;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .success h1 {
            color: #27ae60;
        }

        .retry-btn {
            background: #000;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .retry-btn:hover {
            background: #333;
        }

        .countdown {
            color: #999;
            font-size: 14px;
            margin-top: 15px;
        }

        .debug-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: left;
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }

        .debug-info.show {
            display: block;
        }

        .debug-info h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }

        .debug-info pre {
            white-space: pre-wrap;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 加载状态 -->
        <div id="loading" class="loading">
            <div class="apple-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
            </div>
            <div class="loader"></div>
            <h1>正在处理登录...</h1>
            <p class="message">请稍候，我们正在验证您的 Apple 账号</p>
        </div>

        <!-- 成功状态 -->
        <div id="success" class="success">
            <div class="success-icon">✓</div>
            <h1>登录成功！</h1>
            <p class="message">正在跳转到应用...</p>
            <p class="countdown" id="successCountdown"></p>
        </div>

        <!-- 错误状态 -->
        <div id="error" class="error">
            <div class="error-icon">✕</div>
            <h1>登录失败</h1>
            <p class="message" id="errorMessage">很抱歉，登录过程中出现了问题</p>
            <button class="retry-btn" onclick="retryLogin()">重试</button>
        </div>

        <!-- 调试信息 -->
        <div id="debugInfo" class="debug-info">
            <h3>调试信息</h3>
            <pre id="debugContent"></pre>
        </div>
    </div>

    <script>
        // 配置
        const CONFIG = {
            ELECTRON_PROTOCOL: 'questech',
            API_BASE_URL: window.location.origin,
            DEBUG_MODE: window.location.search.includes('debug=true'),
            REDIRECT_DELAY: 3000, // 成功后跳转延迟（毫秒）
        };

        // 工具函数
        const Utils = {
            // 解析 URL 参数
            getUrlParams() {
                const params = new URLSearchParams(window.location.search);
                const fragment = new URLSearchParams(window.location.hash.slice(1));

                // Apple Sign In 可能通过 query 或 fragment 返回参数
                const result = {};
                for (let [key, value] of params) {
                    result[key] = value;
                }
                for (let [key, value] of fragment) {
                    result[key] = value;
                }

                return result;
            },

            // 检测来源
            detectSource() {
                const params = this.getUrlParams();

                // 1. URL 参数明确指定
                if (params.source === 'electron') return 'electron';
                if (params.source === 'web') return 'web';

                // 2. sessionStorage 检测
                const storedSource = sessionStorage.getItem('apple_login_source');
                if (storedSource) {
                    sessionStorage.removeItem('apple_login_source');
                    return storedSource;
                }

                // 3. User-Agent 检测（如果 Electron 设置了特殊 UA）
                const ua = navigator.userAgent;
                if (ua.includes('Questech') || ua.includes('Electron')) {
                    return 'electron';
                }

                // 默认为 web
                return 'web';
            },

            // 显示调试信息
            showDebug(info) {
                if (!CONFIG.DEBUG_MODE) return;

                const debugEl = document.getElementById('debugInfo');
                const contentEl = document.getElementById('debugContent');
                contentEl.textContent = JSON.stringify(info, null, 2);
                debugEl.classList.add('show');
            },

            // 显示加载状态
            showLoading() {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('success').classList.remove('show');
                document.getElementById('error').classList.remove('show');
            },

            // 显示成功状态
            showSuccess(message, countdown = true) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').classList.remove('show');
                const successEl = document.getElementById('success');
                successEl.classList.add('show');

                if (message) {
                    successEl.querySelector('.message').textContent = message;
                }

                if (countdown) {
                    this.startCountdown();
                }
            },

            // 显示错误状态
            showError(message) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('success').classList.remove('show');
                const errorEl = document.getElementById('error');
                errorEl.classList.add('show');
                document.getElementById('errorMessage').textContent = message;
            },

            // 倒计时
            startCountdown() {
                let seconds = Math.floor(CONFIG.REDIRECT_DELAY / 1000);
                const countdownEl = document.getElementById('successCountdown');

                const updateCountdown = () => {
                    countdownEl.textContent = `${seconds} 秒后自动跳转...`;
                    seconds--;
                    if (seconds < 0) {
                        clearInterval(timer);
                    }
                };

                updateCountdown();
                const timer = setInterval(updateCountdown, 1000);
            }
        };

        // Apple 登录数据处理
        class AppleAuthHandler {
            constructor() {
                this.params = Utils.getUrlParams();
                this.source = Utils.detectSource();

                Utils.showDebug({
                    params: this.params,
                    source: this.source,
                    userAgent: navigator.userAgent
                });
            }

            // 验证参数
            validate() {
                // 检查是否有错误
                if (this.params.error) {
                    throw new Error(this.getErrorMessage(this.params.error));
                }

                // 检查必需参数（Apple 可能通过 POST 返回，这里也处理 fragment）
                if (!this.params.code && !this.params.id_token) {
                    throw new Error('缺少必要的认证参数');
                }

                return true;
            }

            // 获取错误信息
            getErrorMessage(errorCode) {
                const errorMessages = {
                    'user_cancelled_authorize': '您已取消授权',
                    'access_denied': '访问被拒绝',
                    'invalid_request': '无效的请求',
                    'invalid_client': '无效的客户端',
                    'invalid_grant': '无效的授权',
                    'unauthorized_client': '未授权的客户端',
                    'unsupported_grant_type': '不支持的授权类型',
                    'invalid_scope': '无效的权限范围'
                };

                return errorMessages[errorCode] || `登录失败：${errorCode}`;
            }

            // 处理 Electron 场景
            async handleElectron() {
                Utils.showSuccess('正在启动应用...', false);

                // 构造自定义协议 URL
                const protocolUrl = this.buildProtocolUrl();

                Utils.showDebug({
                    action: 'Launching Electron',
                    protocolUrl: protocolUrl
                });

                // 尝试唤起 Electron
                window.location.href = protocolUrl;

                // 3秒后提示用户
                setTimeout(() => {
                    Utils.showSuccess(
                        '如果应用未自动打开，请手动启动应用并重试登录',
                        false
                    );
                }, 3000);
            }

            // 构造自定义协议 URL
            buildProtocolUrl() {
                const params = new URLSearchParams();

                if (this.params.code) params.append('code', this.params.code);
                if (this.params.state) params.append('state', this.params.state);
                if (this.params.id_token) params.append('id_token', this.params.id_token);
                if (this.params.user) params.append('user', this.params.user);

                return `${CONFIG.ELECTRON_PROTOCOL}://auth/apple?${params.toString()}`;
            }

            // 处理 Web 场景
            async handleWeb() {
                try {
                    // 准备登录数据
                    const loginData = {
                        type: 2, // Apple 登录
                        platform: 'web'
                    };

                    // 优先使用 id_token，其次使用 code
                    if (this.params.id_token) {
                        loginData.id_token = this.params.id_token;
                    }
                    if (this.params.code) {
                        loginData.code = this.params.code;
                    }

                    // 如果有用户信息（首次登录）
                    if (this.params.user) {
                        try {
                            const userInfo = JSON.parse(this.params.user);
                            if (userInfo.email) loginData.email = userInfo.email;
                            if (userInfo.name) {
                                loginData.full_name = `${userInfo.name.firstName || ''} ${userInfo.name.lastName || ''}`.trim();
                            }
                        } catch (e) {
                            console.warn('Failed to parse user info:', e);
                        }
                    }

                    Utils.showDebug({
                        action: 'Calling API',
                        endpoint: '/api/user/',
                        data: loginData
                    });

                    // 调用后端 API（使用实际的 API 端点）
                    const response = await fetch(`${CONFIG.API_BASE_URL}/api/user/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(loginData)
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || '登录失败');
                    }

                    const result = await response.json();

                    Utils.showDebug({
                        action: 'API Response',
                        result: result
                    });

                    // 保存 token（使用双 token 机制）
                    if (result.success && result.data) {
                        const data = result.data;

                        // 保存 access token 和 refresh token
                        if (data.access_token) {
                            localStorage.setItem('access_token', data.access_token);
                        }
                        if (data.refresh_token) {
                            localStorage.setItem('refresh_token', data.refresh_token);
                        }
                        if (data.user_identifier) {
                            localStorage.setItem('user_identifier', data.user_identifier);
                        }

                        // 保存用户信息
                        if (data.username || data.email) {
                            localStorage.setItem('user', JSON.stringify({
                                username: data.username,
                                email: data.email,
                                user_identifier: data.user_identifier
                            }));
                        }
                    }

                    // 显示成功并跳转
                    Utils.showSuccess('登录成功！正在跳转...', true);

                    setTimeout(() => {
                        window.location.href = '/';
                    }, CONFIG.REDIRECT_DELAY);

                } catch (error) {
                    console.error('Web login error:', error);
                    throw error;
                }
            }

            // 主处理函数
            async handle() {
                try {
                    // 验证参数
                    this.validate();

                    // 根据来源处理
                    if (this.source === 'electron') {
                        await this.handleElectron();
                    } else {
                        await this.handleWeb();
                    }

                } catch (error) {
                    console.error('Apple auth error:', error);
                    Utils.showError(error.message || '登录过程中出现未知错误');
                }
            }
        }

        // 重试登录
        function retryLogin() {
            // 清除参数重新加载
            window.location.href = window.location.origin + window.location.pathname;
        }

        // 页面加载后自动处理
        window.addEventListener('DOMContentLoaded', () => {
            const handler = new AppleAuthHandler();
            handler.handle();
        });

        // 处理 POST 表单提交（Apple 可能通过 POST 返回数据）
        window.addEventListener('load', () => {
            // 检查是否是表单提交
            if (document.forms.length > 0) {
                const form = document.forms[0];
                const formData = new FormData(form);
                const params = {};

                for (let [key, value] of formData) {
                    params[key] = value;
                }

                if (Object.keys(params).length > 0) {
                    // 将表单数据转换为 URL 参数并重新加载
                    const queryString = new URLSearchParams(params).toString();
                    window.location.href = `${window.location.pathname}?${queryString}`;
                }
            }
        });
    </script>
</body>
</html>

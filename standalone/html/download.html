<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载 Quantech</title>
    <!-- 浏览器图标 -->
    <link rel="icon" type="image/x-icon" href="https://static.baizesz.com/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="https://static.baizesz.com/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://static.baizesz.com/icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://static.baizesz.com/icons/apple-touch-icon.png">
    <link rel="manifest" href="https://static.baizesz.com/icons/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        /* ========== 基础调色板 ========== */
        :root {
            /* 灰色系 - 只保留用到的 */
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --black: #000000;

            /* 蓝色系 - 只保留用到的 */
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;

            /* 绿色系 - 只保留用到的 */
            --green-500: #22c55e;
            --green-600: #16a34a;

            /* 橙色系 - 只保留用到的 */
            --orange-500: #f97316;
            --orange-600: #ea580c;

            /* 红色系 - 只保留用到的 */
            --red-600: #dc2626;

            /* 青色系 - 只保留用到的 */
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
        }

        /* ========== 默认浅色主题 ========== */
        @media (prefers-color-scheme: light) {
            html {
                /* 主要颜色 - 只保留用到的 */
                --color-primary: var(--blue-500);
                --color-primary-hover: var(--blue-600);

                /* 背景颜色 - 只保留用到的 */
                --color-background: var(--white);

                /* 表面颜色 - 只保留用到的 */
                --color-surface: var(--white);
                --color-surface-secondary: var(--gray-50);

                /* 文本颜色 - 只保留用到的 */
                --color-text-primary: var(--gray-900);
                --color-text-secondary: var(--gray-700);
                --color-text-tertiary: var(--gray-500);

                /* 边框颜色 - 只保留用到的 */
                --color-border: var(--gray-200);

                /* 状态颜色 - 只保留用到的 */
                --color-success: var(--green-500);
                --color-success-light: #f0fdf4;
            }
        }

        /* ========== 深色主题覆盖 ========== */
        @media (prefers-color-scheme: dark) {
            html {
                /* 主要颜色 - 只保留用到的 */
                --color-primary: #60a5fa;
                --color-primary-hover: #93c5fd;

                /* 背景颜色 - 只保留用到的 */
                --color-background: #121212;

                /* 表面颜色 - 只保留用到的 */
                --color-surface: #1e1e1e;
                --color-surface-secondary: #2d2d2d;

                /* 文本颜色 - 只保留用到的 */
                --color-text-primary: var(--white);
                --color-text-secondary: #d1d5db;
                --color-text-tertiary: #9ca3af;

                /* 边框颜色 - 只保留用到的 */
                --color-border: #374151;

                /* 状态颜色 - 只保留用到的 */
                --color-success: #4ade80;
                --color-success-light: #14532d;
            }
        }

        /* ========== 基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--color-text-primary);
            background-color: var(--color-background);
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ========== 布局组件 ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ========== 导航栏 ========== */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* 深色模式下的导航栏穿透效果 */
        @media (prefers-color-scheme: dark) {
            .navbar {
                background-color: rgba(18, 18, 18, 0.8);
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        .navbar-content {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ========== 主内容区域 ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        /* ========== 标题区域 ========== */
        .hero-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: var(--color-text-secondary);
            margin: 0 auto;
        }

        /* ========== 平台选择区域 ========== */
        .platform-selection {
            margin: 40px 0;
        }

        .platform-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            max-width: 800px;
            margin: 0 auto;
        }

        .platform-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 24px;
            background-color: var(--color-surface);
            border: 2px solid var(--color-border);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            position: relative;
            overflow: hidden;
        }

        .platform-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .platform-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15);
            border-color: var(--color-primary);
        }

        .platform-item:hover::before {
            opacity: 0.05;
        }

        .platform-item.active {
            border-color: var(--color-primary);
            background-color: var(--color-primary);
            color: white;
        }

        .platform-item.active .platform-icon,
        .platform-item.active .platform-label {
            color: white;
        }

        .platform-icon {
            position: relative;
            z-index: 1;
            color: var(--color-primary);
            transition: color 0.3s ease;
        }

        .platform-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-primary);
            text-align: center;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        /* ========== 下载详情区域 ========== */
        .download-details {
            margin: 40px 0 64px 0;
            min-height: 400px;
        }

        .details-content {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .details-content.show {
            opacity: 1;
            transform: translateY(0);
        }

        .default-message {
            text-align: center;
            color: var(--color-text-secondary);
            padding: 60px 20px;
        }

        .message-icon {
            color: var(--color-text-tertiary);
            margin-bottom: 24px;
        }

        .default-message h3 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-text-primary);
        }

        .default-message p {
            font-size: 16px;
            line-height: 1.6;
        }

        .platform-details {
            animation: fadeInUp 0.5s ease-out;
        }

        .platform-details .platform-description {
            font-size: 16px;
            color: var(--color-text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: center;
        }

        .download-grid {
            max-width: 700px;
            margin: 0 auto;
        }

        .download-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background-color: var(--color-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .download-row-full {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            background-color: var(--color-surface);
            transition: all 0.2s ease;
            text-decoration: none;
            color: var(--color-text-primary);
            padding: 0 20px;
        }

        .download-row-full:hover {
            background-color: var(--color-surface-secondary);
        }

        .download-text {
            font-size: 15px;
            font-weight: 400;
            color: var(--color-text-primary);
            flex: 1;
            pointer-events: none;
        }

        .download-button {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--color-primary);
            transition: all 0.2s ease;
            padding: 4px;
            border-radius: 4px;
        }

        .download-button:hover {
            transform: scale(1.05);
        }

        .download-button i {
            color: var(--color-primary);
        }

        /* ========== 加载和错误状态 ========== */
        .loading-state,
        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 3px solid var(--color-border);
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .error-icon {
            color: var(--red-600);
            margin-bottom: 16px;
        }

        .loading-state h3,
        .error-state h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text-primary);
        }

        .loading-state p,
        .error-state p {
            font-size: 16px;
            line-height: 1.5;
        }

        /* ========== 页脚 ========== */
        footer {
            text-align: center;
            margin: 0 auto;
            padding: 5px 0;

            .footer-content {
                margin-bottom: 0px;
            }

            .footer-content p {
                color: var(--color-text-tertiary);
                font-size: 12px;
                margin: 5px 0;
            }

            .footer-link {
                color: #a8a9ab;
                text-decoration: none;
            }

            .footer-link:hover {
                color: var(--color-text-secondary);
                text-decoration: underline;
            }

            .wrapper {
                color: #a8a9ab;
                font-size: 10px;
                margin: 0 auto;
            }

            .wrapper a {
                color: inherit;
                text-decoration: none;
            }

            .wrapper a:hover {
                text-decoration: underline;
            }
        }

        /* ========== 版本信息区域 ========== */
        .version-info {
            margin: 32px 0;
            text-align: center;
        }

        .version-content {
            display: inline-flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px 32px;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        .version-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .version-info-row {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .version-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .version-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        .version-number {
            font-size: 16px;
            font-weight: 700;
            color: white;
            background-color: var(--color-primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
        }

        .release-notes-preview {
            font-size: 14px;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .expand-icon {
            color: var(--color-text-tertiary);
            transition: transform 0.3s ease;
            flex-shrink: 0;
            transform: rotate(0deg);
        }

        .version-content.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .release-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            color: var(--color-text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .version-content.expanded .release-details {
            max-height: 400px;
            overflow-y: auto;
        }

        .release-details h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-text-primary);
        }

        .release-details ul {
            margin: 0;
            padding-left: 20px;
        }

        .release-details li {
            margin-bottom: 8px;
        }

        /* ========== 响应式设计 ========== */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .version-content {
                padding: 12px 20px;
            }

            .version-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .version-info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .platform-row {
                gap: 16px;
            }

            .platform-item {
                min-width: 100px;
                padding: 20px 16px;
            }

            .details-content {
                padding: 24px;
            }

            .navbar-content {
                flex-direction: column;
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 8px;
            }

            .hero-title {
                font-size: 1.75rem;
            }

            .main-content {
                padding: 48px 0;
            }

            .platform-row {
                gap: 12px;
            }

            .platform-item {
                min-width: 80px;
                padding: 16px 12px;
            }

            .platform-label {
                font-size: 12px;
            }

            .details-content {
                padding: 20px;
            }

            .platform-details h2 {
                font-size: 24px;
            }

            .download-text {
                font-size: 14px;
            }
        }

        /* ========== 动画效果 ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .download-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .download-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .download-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .download-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .download-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <a href="https://www.baizesz.com/" class="logo">
                    <img src="https://static.baizesz.com/icons/favicon.ico" alt="Quantech" width=32" height="32"
                        style="margin-right: 8px;">
                    Quantech
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="main-content">
        <div class="container">
            <!-- 标题区域 -->
            <section class="hero-section">
                <h1 class="hero-title">下载 Quantech 应用程序</h1>
                <p class="hero-subtitle">
                    跨平台智能助手，为 Windows、macOS、Linux、iOS 和 Android 用户提供强大的 AI 交互体验
                </p>
            </section>

            <!-- 版本信息区域 -->
            <section class="version-info" id="version-info">
                <div class="version-content" id="version-content" onclick="toggleVersionDetails()">
                    <div class="version-header">
                        <div class="version-info-row">
                            <div class="version-badge">
                                <span class="version-label">最新版本</span>
                                <span class="version-number" id="latest-version">v1.0.2</span>
                            </div>
                            <div class="release-notes-preview" id="release-notes-preview">版本更新详情</div>
                        </div>
                        <i data-lucide="chevron-down" class="expand-icon" size="20"></i>
                    </div>
                    <div class="release-details" id="release-details">
                        <ul id="release-details-list">
                            <li>新版本包含多项功能改进和bug修复</li>
                        </ul>
                    </div>
                </div>
            </section>

            <!-- 平台选择区域 -->
            <section class="platform-selection">
                <div class="platform-row">
                    <div class="platform-item" data-platform="windows">
                        <div class="platform-icon">
                            <i data-lucide="monitor" size="48"></i>
                        </div>
                        <div class="platform-label">Windows</div>
                    </div>
                    <div class="platform-item" data-platform="macos">
                        <div class="platform-icon">
                            <i data-lucide="laptop" size="48"></i>
                        </div>
                        <div class="platform-label">macOS</div>
                    </div>
                    <div class="platform-item" data-platform="linux">
                        <div class="platform-icon">
                            <i data-lucide="terminal" size="48"></i>
                        </div>
                        <div class="platform-label">Linux</div>
                    </div>
                    <div class="platform-item" data-platform="ios">
                        <div class="platform-icon">
                            <i data-lucide="smartphone" size="48"></i>
                        </div>
                        <div class="platform-label">iOS</div>
                    </div>
                    <div class="platform-item" data-platform="android">
                        <div class="platform-icon">
                            <i data-lucide="smartphone" size="48"></i>
                        </div>
                        <div class="platform-label">Android</div>
                    </div>
                </div>
            </section>

            <!-- 下载详情区域 -->
            <section class="download-details" id="download-details">
                <div class="details-content" id="details-content">
                    <!-- 默认提示 -->
                    <div class="default-message">
                        <div class="message-icon">
                            <i data-lucide="download" size="64"></i>
                        </div>
                        <h3>选择平台查看下载选项</h3>
                        <p>点击上方平台图标查看对应的下载版本和安装方式</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 页脚 -->
    <footer>
        <div class="wrapper">
            <div class="footer-content">
                <p>
                    <a href="https://www.baizesz.com/user/private" class="footer-link" target="_blank">隐私政策</a> |
                    <a href="https://www.baizesz.com/user/agreement" class="footer-link" target="_blank">服务条款</a>
                </p>
            </div>

                src="https://beian.mps.gov.cn/web/assets/logo01.6189a29f.png" width="15px" height="15px" alt="">
            <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44030002004900"
                target="_blank">粤公网安备44030002004900号</a>
        </div>
    </footer>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 展开/收起版本详情
        function toggleVersionDetails() {
            const versionContent = document.getElementById('version-content');
            const isExpanded = versionContent.classList.contains('expanded');

            if (isExpanded) {
                versionContent.classList.remove('expanded');
            } else {
                versionContent.classList.add('expanded');
            }
        }

        // 更新版本信息
        function updateVersionInfo(latestVersion, releaseNotes) {
            const versionElement = document.getElementById('latest-version');
            const detailsListElement = document.getElementById('release-details-list');

            if (latestVersion) {
                versionElement.textContent = `v${latestVersion}`;
            }

            if (releaseNotes) {
                // 将发布说明分割为列表项
                const notesArray = releaseNotes.split(/[,，;；、]/).filter(note => note.trim());
                detailsListElement.innerHTML = notesArray.map(note => `<li>${note.trim()}</li>`).join('');
            }
        }

        // 检测系统架构和Linux发行版
        function detectSystemArchitecture() {
            const userAgent = navigator.userAgent;
            const platform = navigator.platform;

            // 检测操作系统
            let os = 'unknown';
            let arch = 'unknown';
            let distro = 'unknown';

            if (userAgent.includes('Windows')) {
                os = 'windows';
                // Windows 架构检测
                if (userAgent.includes('Win64') || userAgent.includes('WOW64') || platform.includes('Win64')) {
                    arch = 'amd64';
                } else if (userAgent.includes('ARM') || userAgent.includes('aarch64')) {
                    arch = 'arm64';
                } else {
                    arch = 'amd64'; // 默认假设为 amd64
                }
            } else if (userAgent.includes('Mac')) {
                os = 'macos';
                // macOS 架构检测
                if (userAgent.includes('Intel') || platform.includes('Intel') || userAgent.includes('MacIntel')) {
                    arch = 'intel';
                } else if (userAgent.includes('ARM') || userAgent.includes('aarch64') || platform.includes('MacARM')) {
                    arch = 'apple-silicon';
                } else {
                    // 对于较新的 macOS 系统，默认假设为 Apple Silicon
                    arch = 'apple-silicon';
                }
            } else if (userAgent.includes('Linux')) {
                os = 'linux';
                if (userAgent.includes('x86_64') || userAgent.includes('amd64')) {
                    arch = 'amd64';
                } else if (userAgent.includes('ARM') || userAgent.includes('aarch64')) {
                    arch = 'arm64';
                } else {
                    arch = 'amd64';
                }

                // 检测Linux发行版
                if (userAgent.includes('Ubuntu') || userAgent.includes('Debian')) {
                    distro = 'debian';
                } else if (userAgent.includes('Fedora') || userAgent.includes('RHEL') || userAgent.includes('CentOS') || userAgent.includes('Red Hat')) {
                    distro = 'redhat';
                } else if (userAgent.includes('SUSE') || userAgent.includes('openSUSE')) {
                    distro = 'suse';
                } else if (userAgent.includes('Arch')) {
                    distro = 'arch';
                }
            }

            return { os, arch, distro };
        }

        // 从API获取下载信息
        async function fetchDownloadData() {
            try {
                // 请求所有平台的数据
                const response = await fetch(`https://api.baizesz.com/config/downloads/`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        downloadData = data;
                    } else {
                        throw new Error('API返回失败');
                    }
                } else {
                    throw new Error('网络请求失败');
                }
            } catch (error) {
                console.warn('API请求失败，使用默认数据:', error);
                // 使用默认数据
                downloadData = getDefaultDownloadData();
            }

            // 更新版本信息
            updateVersionInfo(downloadData.data.latest_version, downloadData.data.release_notes);

            // 自动选择并显示当前系统的平台详情
            const { os: currentOs } = detectSystemArchitecture();
            let autoSelectPlatform = 'windows'; // 默认选择Windows

            switch (currentOs) {
                case 'windows':
                    autoSelectPlatform = 'windows';
                    break;
                case 'macos':
                    autoSelectPlatform = 'macos';
                    break;
                case 'linux':
                    autoSelectPlatform = 'linux';
                    break;
            }

            // 自动选中当前系统平台并显示详情
            showPlatformDetails(autoSelectPlatform);

            // 设置平台激活状态
            const targetItem = document.querySelector(`[data-platform="${autoSelectPlatform}"]`);
            if (targetItem) {
                targetItem.classList.add('active');
            }
        }
